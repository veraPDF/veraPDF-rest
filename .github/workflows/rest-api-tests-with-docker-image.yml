name: Rest-api tests - ghcr.io/verapdf/rest:latest

on:
  schedule:
    - cron: "05 09 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'veraPDF/veraPDF-rest'
    name: Rest-api tests running in Docker container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start veraPDF REST service
        run: |
          docker run -d --name verarest -p 8080:8080 ghcr.io/verapdf/rest:latest
          sleep 10
          docker ps | grep verarest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p ./results
          pytest --base_url=http://localhost:8080 --html=./results/report.html ./tests/

      - name: Debug (if tests fail)
        if: failure()
        run: |
          echo "Checking if container is running:"
          docker ps -a
          echo "Container logs:"
          docker logs verarest || echo "No logs available"
          echo "Testing connection:"
          curl -v http://localhost:8080/api/version || echo "Service not responding"

      - name: Generating report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: Results
          path: "./results"

      - name: Clean up Docker container
        if: always()
        run: |
          docker stop verarest || true
          docker rm verarest || true

      - name: Notify slack tests succeeded
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel_id: C03E3JJGLQL
          status: SUCCESS
          color: good

      - name: Notify slack tests failed
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel_id: C03E3JJGLQL
          status: FAILED
          color: danger
